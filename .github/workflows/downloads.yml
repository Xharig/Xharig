# Zaehlt die Downloads aller VerseKit-Releases und schreibt sie in downloads.json.
#
# Warum ueberhaupt selbst zaehlen?
#   Das fertige Badge von shields.io (github/downloads/.../total) holt sich nur EINE
#   Seite von der GitHub-Schnittstelle, und die fasst hoechstens 100 Releases.
#   VerseKit hat mehr, also fehlten die aeltesten in der Summe (Stand 23.09.2026:
#   950 statt 1184). Dieser Lauf blaettert mit --paginate durch alle Seiten.
#
# Ergebnis liest das Badge im README ueber shields.io/endpoint.

name: Download-Zaehler

on:
  schedule:
    # taeglich 04:17 UTC - krumme Zeit mit Absicht, da sind die Runner frei
    - cron: "17 4 * * *"
  workflow_dispatch:      # laesst sich auch von Hand ausloesen

permissions:
  contents: write         # der Lauf schreibt downloads.json zurueck ins Repo

jobs:
  zaehlen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Downloads ueber alle Releases summieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # --paginate holt ALLE Seiten, nicht nur die ersten 100 Releases
          summe=$(gh api --paginate repos/Xharig/VerseKit/releases \
                    --jq '.[].assets[].download_count' \
                  | awk '{s+=$1} END {print s+0}')

          # Sicherheitsnetz: eine 0 waere fast immer ein Fehler (API-Panne,
          # Rechte weg, Repo umbenannt) - dann lieber abbrechen als das
          # Badge auf null setzen.
          if [ "$summe" -le 0 ]; then
            echo "Summe ist $summe - das kann nicht stimmen, Abbruch."
            exit 1
          fi

          # Tausenderpunkte: 1184 -> 1.184
          anzeige=$(python3 -c 'import sys; print(f"{int(sys.argv[1]):,}".replace(",", "."))' "$summe")
          echo "Gezaehlt: $summe -> Anzeige: $anzeige"

          # Format, das shields.io/endpoint erwartet
          jq -n --arg m "$anzeige" \
            '{schemaVersion: 1, label: "Heruntergeladen", message: $m, color: "5fa522"}' \
            > downloads.json

          cat downloads.json

      - name: Nur bei Aenderung zurueckschreiben
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          # ohne Aenderung kein Commit - sonst waechst die Historie jeden Tag
          if git diff --cached --quiet; then
            echo "Zahl unveraendert, nichts zu tun."
          else
            git commit -m "Download-Zahl aktualisiert"
            git push
          fi
